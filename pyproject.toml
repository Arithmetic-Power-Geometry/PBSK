[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbsk"
version = "4.0.0"
description = "Power-validated, book-wide, temporally locked tests of possibility-to-breakthrough structure in scientific knowledge"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Mohammad Amir Khusru Akhtar"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[project.scripts]
pbsk = "pbsk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
